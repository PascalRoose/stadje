name: Bug report
description: Something in the game is broken or behaving unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Puzzle date (if relevant)
      description: The date shown under the "Stadje" title, e.g. 17 SEP.
  - type: dropdown
    id: platform
    attributes:
      label: Device / browser
      options:
        - Desktop — Chrome
        - Desktop — Firefox
        - Desktop — Safari
        - Desktop — other
        - Mobile — iOS Safari
        - Mobile — Android Chrome
        - Mobile — other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
